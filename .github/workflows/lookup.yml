name: Lookup EUVD

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product / component name (EUVD product=)
        required: true
        type: string
      vendor:
        description: Optional vendor
        required: false
        type: string
      slug:
        description: File slug under data/products (default = slugified product)
        required: false
        type: string

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matcher
        run: pip install -e .

      - name: Fetch EUVD snapshot
        env:
          PRODUCT: ${{ inputs.product }}
          VENDOR: ${{ inputs.vendor }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          args=(snapshot --product "$PRODUCT" --interval 0.3)
          if [ -n "${VENDOR}" ]; then args+=(--vendor "$VENDOR"); fi
          if [ -n "${SLUG}" ]; then args+=(--slug "$SLUG"); fi
          python -m euvd_mapper "${args[@]}"

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh EUVD snapshot for ${{ inputs.product }}"
            git push
          fi
