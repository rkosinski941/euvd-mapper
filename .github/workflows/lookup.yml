name: Lookup EUVD

on:
  workflow_dispatch:
    inputs:
      product:
        description: Product / component name (EUVD product=)
        required: true
        type: string
      vendor:
        description: Optional vendor
        required: false
        type: string
      slug:
        description: File slug under data/products (default = slugified product)
        required: false
        type: string

permissions:
  contents: write

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch EUVD snapshot
        env:
          PRODUCT: ${{ inputs.product }}
          VENDOR: ${{ inputs.vendor }}
          SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, urllib.parse, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          product = os.environ["PRODUCT"].strip()
          vendor = os.environ.get("VENDOR", "").strip()
          slug = os.environ.get("SLUG", "").strip()
          if not slug:
              slug = re.sub(r"[^a-z0-9]+", "-", product.lower()).strip("-")
          headers = {
              "Accept": "application/json",
              "User-Agent": "euvd-mapper/0.1 (https://github.com/rkosinski941/euvd-mapper)",
          }
          items = []
          total = None
          for page in range(5):
              q = {"product": product, "size": 100, "page": page}
              if vendor:
                  q["vendor"] = vendor
              url = "https://euvdservices.enisa.europa.eu/api/search?" + urllib.parse.urlencode(q)
              req = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as resp:
                  data = json.load(resp)
              if total is None:
                  total = data.get("total")
              batch = data.get("items") or []
              if not batch:
                  break
              items.extend(batch)
              if total is not None and len(items) >= int(total):
                  break

          out = {
              "queriedAt": datetime.now(timezone.utc).isoformat(),
              "product": product,
              "vendor": vendor,
              "source": "https://euvdservices.enisa.europa.eu/api/search",
              "totalReported": total,
              "itemCount": len(items),
              "items": items,
          }
          dest = Path("data/products") / f"{slug}.json"
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(json.dumps(out, indent=2), encoding="utf-8")

          catalog_path = Path("data/catalog.json")
          catalog = json.loads(catalog_path.read_text(encoding="utf-8"))
          entry = {
              "id": slug,
              "name": product,
              "vendor": vendor,
              "file": f"products/{slug}.json",
              "queryProduct": product,
              "itemCount": len(items),
              "total": total,
          }
          products = [p for p in catalog.get("products", []) if p.get("id") != slug]
          products.append(entry)
          products.sort(key=lambda p: p.get("name", "").lower())
          catalog["products"] = products
          catalog["generated"] = datetime.now(timezone.utc).date().isoformat()
          catalog_path.write_text(json.dumps(catalog, indent=2) + "\n", encoding="utf-8")
          print(f"Wrote {dest} ({len(items)} of {total})")
          PY

      - name: Commit snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh EUVD snapshot for ${{ inputs.product }}"
            git push
          fi
